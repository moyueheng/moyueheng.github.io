[config.site]
title = "myhron"
description = "myhron 的个人空间，用来放文章、项目和生活片段。"
pageTitle = "myhron | 个人空间"
pageDescription = "myhron 的个人空间：文章、项目和生活片段。"
url = "https://moyueheng.github.io"
repository = "https://github.com/moyueheng/navfolio"
footerNote = "© 2026 myhron"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-CN"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "搜索内容..."
maxResults = 6

[config.pages.blog]
title = "文章"
kicker = "NOTEBOOK"
subtitle = "长文、笔记与项目记录。"
note = "按时间整理的写作归档。"
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "分类"
kicker = "CATEGORIES"
subtitle = ""
note = "按文章 frontmatter 汇总的主题索引。"

[config.pages.blog.series]
title = "系列"
kicker = "SERIES"
subtitle = ""
note = "可以按写作顺序连着读的系列文章。"

[config.pages.projects]
title = "项目"
kicker = "PROJECT SHELF"
subtitle = "做过的东西与记录。"
note = "项目入口、实现说明和发布记录。"

[config.pages.vibe]
title = "Vibe"
kicker = ""
subtitle = "生活与开发的碎片。"
note = "不够正式写成文章，但仍然值得留下的片段。"
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "myhron"
handle = "@myhron"
role = "个人空间"
email = "moyueheng@gmail.com"
website = "https://moyueheng.github.io/"
github = "https://github.com/moyueheng"
avatar = "/images/avatar.webp"

[[config.topNav.links]]
label = "首页"
href = "/"

[[config.topNav.links]]
label = "文章"
href = "/blog"

[[config.topNav.links]]
label = "项目"
module = "projects"

[[config.topNav.links]]
label = "Vibe"
module = "vibe"

[[config.topNav.links]]
label = "书影音"
module = "media"

[[config.topNav.links]]
label = "关于"
href = "/about"

[config.home]
doing = []

